; minphony expects a conventional "all" build target, which doesn't apply
; here: this Makefile is a task runner (default goal is "run"), not a
; build system with build products.
[minphony]
disabled = true

; The "login" recipe is one atomic interactive flow (prompt, read, validate,
; replace secret); 6 lines reflects that, not a target that needs splitting.
[maxbodylength]
maxBodyLength = 6
